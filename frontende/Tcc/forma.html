<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="stylesheet" href="css/formCss.css">

    <title>Criar conta</title>
</head>

<body>

    <main id="form_container">

        <div id="form_header">
            <h1 id="form_title">Criar conta</h1>

            <button type="button" class="btn-default">
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </div>

        <form action="" id="form">

            <div id="input_container">

                <!-- Nome -->
                <div class="input-box">
                    <label for="name" class="form-label">
                        Primeiro Nome
                    </label>

                    <div class="input-field">
                        <input type="text" name="name" id="name" class="form-control" placeholder="Nome">

                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <!-- Sobrenome -->
                <div class="input-box">
                    <label for="lastname" class="form-label">
                        Sobrenome
                    </label>

                    <div class="input-field">
                        <input type="text" name="lastname" id="lastname" class="form-control" placeholder="Sobrenome">

                        <i class="fa-regular fa-user"></i>
                    </div>
                </div>

                <!-- Data de nascimento -->
                <div class="input-box">
                    <label for="birthdate" class="form-label">
                        Data de Nascimento
                    </label>
                 <div
            data-coreui-locale="pt-BR"
            data-coreui-toggle="calendar"
            data-coreui-target="#birthdate"
          ></div>
                    <div class="input-field">
                        <input type="date" name="birthdate" id="birthdate" class="form-control">

                        <i class="fa-regular fa-calendar"></i>
                    </div>
                </div>

                <!-- Email -->
                <div class="input-box">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <div class="input-field">
                        <input type="email" name="email" id="email" class="form-control"
                            placeholder="exemplo@gmail.com">

                        <i class="fa-regular fa-envelope"></i>
                    </div>
                </div>

                <!-- Senha -->
                <div class="input-box">
                    <label for="password" class="form-label">
                        Senha
                    </label>

                    <div class="input-field">
                        <input type="password" name="password" id="password" class="form-control" placeholder="****">

                        <i class="fa-solid fa-eye passwordIcon"></i>
                    </div>
                </div>

                <!-- Botão -->
                <button type="submit" class="btn-default">
                    <i class="fa-solid fa-check"></i>
                    Criar conta
                </button>

            </div>

        </form>

    </main>

   <script src="js/formJs.js"></script>
</body>

</html>
