<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/formCss.css">

    <title>Criar conta</title>
</head>

<body>

    <main id="form_container">

        <div id="form_header">
            <h1 id="form_title">Entrar na sua conta</h1>
<a href="index.html" class="text-decoration-none">
            <button type="button" class="btn-default-exit">
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
            </a>
        </div>

        <form action="" id="form">

            <div id="input_container" class="d-flex flex-column align-items-center gap-3">
                <!-- Email -->
                <div class="input-box w-100">
                    <div class="input-field">
                        <input type="email" name="email" id="email" class="form-control"
                            placeholder="Use o Email">

                        <i class="fa-regular fa-envelope"></i>
                    </div>
<!--SENHA-->
   <div class="input-box mt-3">
                    <div class="input-field">
                        <input type="password" name="password" id="password" class="form-control" placeholder="Digite uma Senha">

                        <i class="fa-solid fa-eye passwordIcon"></i>
                    </div>
                </div>





      <div class="d-flex align-items-center gap-3 my-3">
    <hr class="flex-grow-1">
    <span>Ou</span>
    <hr class="flex-grow-1">
</div>
                </div>



                <!-- Botão -->
                   <div class="input-box w-100">
                   <div class="input-field">
               <a href="/oauth2/authorization/google"
           class="google-btn">

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google">

            <span>Sign in with Google</span>
        </a>
    </div>
                   </div>
                   </div>
            </div>

        </form>

    </main>
     <script src="js/formJs.js"></script>
</body>

</html>
