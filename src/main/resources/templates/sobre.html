<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/vendor/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/indexCss.css" />
    <link rel="stylesheet" href="/css/footerCss.css" />
    <link rel="stylesheet" href="/css/integracao.css" />
    <title>Sobre o Aponte — Aponte</title>
    <link rel="icon" type="image/png" href="/img/aponte-favicon-quadrado.png" />

  <body>
    <div th:replace="~{fragmentos :: cabecalho(false)}"></div>
    <main class="container conteudo-pagina">
      <h1>Sobre o Aponte</h1>

        O Aponte é um projeto acadêmico para encontrar estabelecimentos de
        alimentação, salvar favoritos e compartilhar avaliações. O mapa combina

      </p>
      <a href="/index.html">Voltar ao início</a>
    </main>
    <div th:replace="~{fragmentos :: rodape}"></div>
    <script src="/js/app.js"></script>
    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
  </body>
</html>
