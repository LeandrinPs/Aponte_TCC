<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/vendor/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/integracao.css" />
    <link rel="stylesheet" href="/css/formCss.css" />
    <title>Criar conta — Aponte</title>
    <link rel="icon" type="image/png" href="/img/logo1.png" />
  </head>
  <body>
    <main id="form_container">
      <div id="form_header">
        <h1 id="form_title">Criar conta</h1>
     <a href="index.html" class="text-decoration-none">
            <button type="button" class="btn-default-exit my-4">
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
            </a>
      </div>
      <p th:if="${param.cadastrado}" class="alert alert-success">
        Conta criada. Entre para continuar.
      </p>
      <p th:if="${param.erro}" class="alert alert-danger">
        Login ou senha incorretos.
      </p>
      <p id="mensagem-form" role="status" aria-live="polite"></p>

      <form id="cadastro-form">
        <div id="input_container" class="d-flex flex-column align-items-center gap-3">
          <div class="input-box w-100">
           <div class="input-field">
           <input
            class="form-control"
            id="nome"
            name="nome"
            required
            maxlength="50"
            autocomplete="name"
            placeholder="Digite seu Nome:"
          />
          </div>
           <div class="input-field mt-2">
      <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            autocomplete="username"
             placeholder="Digite seu Email:"
            required
            maxlength="50"
          />
        </div>
 <div class="input-box mt-2 mb-4">
          <div class="input-field">
            <input
              class="form-control"
              type="password"
              id="password"
              name="senha"
              autocomplete="new-password"
              placeholder="Crie uma Senha:"
              required
              minlength="8"
              maxlength="72"
            /> <i class="fa-solid fa-eye passwordIcon"></i>
            </div>
          </div>
          <button class="btn btn-danger" type="submit">Cadastrar</button>
          </div>
                  </div>
<div class="d-flex align-items-center gap-3 my-3">
    <hr class="flex-grow-1">
    <span>Ou</span>
    <hr class="flex-grow-1">
</div>
                </div>
                  <div class="input-box w-100 mb-5">
                   <div class="input-field">
               <a href="/oauth2/authorization/google"
           class="google-btn">

            <img
                src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                alt="Google">

            <span>Sign in with Google</span>
        </a>
    </div>
                   </div>

          Já tem uma conta?  <a href="/entra.html">Entrar na conta</a>
      </form>
    </main>

     <div class="position-absolute top-0 end-0">
            <img src="./img/logo final.png" width="350px" height="350px"> 
         </div>
    <script src="/js/app.js"></script>
    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/formJs.js"></script>
  </body>
</html>
