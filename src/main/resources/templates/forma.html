<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/vendor/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/indexCss.css" />
    <link rel="stylesheet" href="/css/footerCss.css" />
    <link rel="stylesheet" href="/css/integracao.css" />
    <link rel="stylesheet" href="/css/formCss.css" />
    <title>Criar conta — Aponte</title>
    <link rel="icon" type="image/png" href="/img/aponte-favicon-quadrado.png" />
  </head>
  <body>
    <main id="form_container">
      <div id="form_header">
        <h1 id="form_title">Criar conta</h1>
        <a href="/index.html" class="link-danger" aria-label="Voltar ao início"
          >Voltar</a
        >
      </div>
      <p th:if="${param.cadastrado}" class="alert alert-success">
        Conta criada. Entre para continuar.
      </p>
      <p th:if="${param.erro}" class="alert alert-danger">
        Login ou senha incorretos.
      </p>
      <p id="mensagem-form" role="status" aria-live="polite"></p>
      <form id="cadastro-form">
        <div id="input_container" class="d-flex flex-column gap-3">
          <label for="nome">Nome</label
          ><input
            class="form-control"
            id="nome"
            name="nome"
            required
            maxlength="50"
            autocomplete="name"
          />
          <label for="email">E-mail</label
          ><input
            class="form-control"
            type="email"
            id="email"
            name="email"
            autocomplete="username"
            required
            maxlength="50"
          />
          <label for="password">Senha</label>
          <div class="input-group">
            <input
              class="form-control"
              type="password"
              id="password"
              name="senha"
              autocomplete="new-password"
              required
              minlength="8"
              maxlength="72"
            /><button
              type="button"
              class="btn btn-outline-secondary"
              id="mostrar-senha"
              aria-label="Mostrar senha"
            >
              Mostrar
            </button>
          </div>
          <button class="btn btn-danger" type="submit">Cadastrar</button
          ><a href="/entra.html">Já tenho conta</a>
        </div>
      </form>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/formJs.js"></script>
  </body>
</html>
