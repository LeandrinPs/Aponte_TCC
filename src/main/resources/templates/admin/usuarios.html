<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/vendor/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/indexCss.css" />
    <link rel="stylesheet" href="/css/footerCss.css" />
    <link rel="stylesheet" href="/css/integracao.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <title>Gerenciar usuários — Aponte</title>
    <link rel="icon" type="image/png" href="/img/logo1.png" />
  </head>
  <body class="admin-layout" th:attr="data-area=${adminArea}">
    <div th:replace="~{fragmentos :: menuAdmin}"></div>
    <main class="admin-pagina">
      <span class="text-danger">ADMINISTRAÇÃO</span>
      <h1>Gerenciar usuários</h1>

      <p id="admin-status" role="status" aria-live="polite"></p>
      <div class="table-responsive">
        <table class="table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-usuarios"></tbody>
        </table>
      </div>
      <form id="editar-usuario" class="card card-body" hidden>
        <h2>Editar usuário</h2>
        <input
          name="nome"
          class="form-control mb-2"
          aria-label="Nome"
          required
          maxlength="50"
        /><input
          name="email"
          type="email"
          class="form-control mb-2"
          aria-label="E-mail"
          required
          maxlength="50"
        /><button class="btn btn-danger">Salvar usuário</button>
      </form>
    </main>
    <script src="/js/app.js"></script>
    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/admin-avisos.js"></script>
    <script src="/js/admin.js"></script>
  </body>
</html>
