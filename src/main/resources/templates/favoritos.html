<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="/css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/css/vendor/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/indexCss.css" />
    <link rel="stylesheet" href="/css/footerCss.css" />
    <link rel="stylesheet" href="/css/integracao.css" />
    <title>Meus favoritos — Aponte</title>
    <link rel="icon" type="image/png" href="/img/logo1.png" />
  </head>
  <body>
    <div th:replace="~{fragmentos :: cabecalho(false)}"></div>
    <main class="container conteudo-pagina">
      <h1>Meus favoritos</h1>
      <p id="favoritos-status" role="status">Carregando favoritos…</p>
      <div class="row g-4" id="lista-favoritos"></div>
    </main>
    <div th:replace="~{fragmentos :: rodape}"></div>
    <script src="/js/app.js"></script>
    <script src="/js/vendor/bootstrap.bundle.min.js"></script>
    <script src="/js/favoritos.js"></script>
    <script
      th:if="${!#strings.isEmpty(mapsKey)}"
      async
      th:src="@{https://maps.googleapis.com/maps/api/js(key=${mapsKey},loading='async',callback='atualizarFotosFavoritos')}"
    ></script>
  </body>
</html>
