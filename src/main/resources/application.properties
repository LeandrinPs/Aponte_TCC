spring.application.name=aponte
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aponte}
spring.datasource.username=${DB_USERNAME:aponte}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
aponte.uploads.dir=${APONTE_UPLOADS_DIR:./uploads}
aponte.google.maps-key=${GOOGLE_MAPS_API_KEY:}
aponte.google.map-id=${GOOGLE_MAPS_MAP_ID:DEMO_MAP_ID}
aponte.admin.bootstrap.enabled=${APONTE_ADMIN_BOOTSTRAP_ENABLED:false}
aponte.admin.bootstrap.nome=${APONTE_ADMIN_NOME:}
aponte.admin.bootstrap.senha=${APONTE_ADMIN_SENHA:}
