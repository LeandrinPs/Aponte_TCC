spring.application.name=aponte
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/aponte}
spring.datasource.username=${DB_USER:${DB_USERNAME:aponte}}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
aponte.uploads.dir=${UPLOADS_DIR:${APONTE_UPLOADS_DIR:./uploads}}
aponte.google.maps-key=${GOOGLE_MAPS_API_KEY:}
aponte.google.map-id=${GOOGLE_MAP_ID:${GOOGLE_MAPS_MAP_ID:DEMO_MAP_ID}}
aponte.google.client-id=${GOOGLE_CLIENT_ID:}
aponte.google.client-secret=${GOOGLE_CLIENT_SECRET:}
aponte.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP:${APONTE_ADMIN_BOOTSTRAP_ENABLED:false}}
aponte.admin.bootstrap.nome=${ADMIN_NOME:${APONTE_ADMIN_NOME:}}
aponte.admin.bootstrap.senha=${ADMIN_SENHA:${APONTE_ADMIN_SENHA:}}
